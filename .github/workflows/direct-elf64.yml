name: Checked Idriç to direct x86-64 ELF64

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IDRIC_COMPILER_REF: Idriç

jobs:
  checked-direct-elf64:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out x86 backend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out current declared Idriç compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: ${{ env.IDRIC_COMPILER_REF }}
          path: .idric

      - name: Run current-head compiler/backend acceptance
        env:
          IDRIC_REPO: ${{ github.workspace }}/.idric
          IDRIC_X86_ARTIFACTS_DIR: ${{ github.workspace }}/build/checked-x86
        run: scripts/run_current_head_ci.sh

      - name: Build and execute framebuffer-red oracle boundary
        run: sh examples/framebuffer-red/check.sh

      - name: Retain compiler/backend/ELF/native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checked-x86-64-evidence
          path: build/checked-x86
          if-no-files-found: warn
